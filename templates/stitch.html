<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Склейка изображений</title>
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="file"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; }
        input[type="submit"] { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background-color: #45a049; }
        .images-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .image-item { border: 1px solid #ddd; border-radius: 4px; padding: 10px; text-align: center; }
        .image-item img { max-width: 100%; height: auto; border-radius: 4px; }
        .histogram-item { grid-column: span 2; text-align: center; margin-top: 10px; }
        .histogram-item img { max-width: 100%; height: auto; border: 1px solid #ccc; }
        hr { margin: 30px 0; }
    </style>
</head>
<body>
    <h2>Склейка двух изображений</h2>
    <form action="/stitch_form" enctype="multipart/form-data" method="post">
        <div class="form-group">
            <label for="file1">Первое изображение:</label>
            <input type="file" name="file1" accept="image/*" required>
        </div>
        <div class="form-group">
            <label for="file2">Второе изображение:</label>
            <input type="file" name="file2" accept="image/*" required>
        </div>
        <div class="form-group">
            <label>Направление склейки:</label>
            <input type="radio" id="horizontal" name="direction" value="horizontal" checked>
            <label for="horizontal" style="display:inline;">Горизонтально</label>
            <input type="radio" id="vertical" name="direction" value="vertical">
            <label for="vertical" style="display:inline;">Вертикально</label>
        </div>
        <div class="form-group">
            <input type="submit" value="Склеить и показать гистограммы" />
        </div>
    </form>

    {% if ready and images %}
        <hr>
        <h2>Результаты:</h2>
        <div class="images-grid">
            <div class="image-item">
                <h3>Первое изображение</h3>
                <img src="/static/{{ images[0] }}" alt="First Image">
            </div>
            <div class="image-item">
                <h3>Второе изображение</h3>
                <img src="/static/{{ images[1] }}" alt="Second Image">
            </div>
            <div class="image-item" style="grid-column: span 2;">
                <h3>Склеенное изображение</h3>
                <img src="/static/{{ stitched_image }}" alt="Stitched Image">
            </div>
            <div class="histogram-item">
                <h3>Гистограмма распределения цветов</h3>
                <img src="/static/{{ histogram_image }}" alt="Color Histogram">
            </div>
        </div>
    {% endif %}
</body>
</html>
